# 🔍 DISCOVERY & FIX LOG
# ======================
# 
# Discovery Date: 2026-08-12
# Issue: PR #78 workflow failures due to PNPM 11+ build script restrictions
# Root Cause: PNPM 11+ ignores build scripts by default for security reasons.
#             The PNPM_ALLOW_BUILDS environment variable does NOT work in pnpm 11+.
#             esbuild and sharp are required devDependencies for Astro builds.
# 
# Fix Applied: Replaced PNPM_ALLOW_BUILDS with pnpm approve-builds command
#              in both lighthouse and performance-benchmark jobs in .github/workflows/performance.yml
#
# Workflow: Performance Monitoring & Benchmarking
#

name: Performance Monitoring & Benchmarking

on:
  push:
    branches: [ main, dev-update ]
  pull_request:
    branches: [ main, dev-update ]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

env:
  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
  PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  pages: read
  checks: write

jobs:
  lighthouse:
    name: Run Lighthouse Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up pnpm with global bin directory
        uses: pnpm/action-setup@v4
        id: pnpm-setup
        with:
          version: 11.21.0
          run_install: false
          ignore-off: true
        env:
          PNPM_HOME: /home/runner/.pnpm-global
          PATH: /home/runner/.pnpm-global/bin:/usr/local/bin:/usr/bin:/bin
      
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      
      - name: Configure PATH for global binaries
        run: |
          # Create pnpm global bin directory if it doesn't exist
          PNPM_GLOBAL_BIN=$(pnpm config get global-bin-dir 2>/dev/null || echo "/home/runner/.pnpm-global/bin")
          echo "PNPM_GLOBAL_BIN=$PNPM_GLOBAL_BIN" >> $GITHUB_ENV
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH
          mkdir -p "$PNPM_GLOBAL_BIN"
          
          # Add pnpm global bin to PATH for all subsequent steps
          export PATH="$PNPM_GLOBAL_BIN:$PATH"
          
          # Verify pnpm is available
          if ! command -v pnpm &> /dev/null; then
            echo "❌ ERROR: pnpm is not available in PATH"
            echo "Current PATH: $PATH"
            which pnpm || true
            exit 1
          fi
          
          pnpm --version
          echo "✅ PATH configured: $PNPM_GLOBAL_BIN added to PATH"
      # CRITICAL FIX for pnpm 11+ security: Configure build scripts
      # pnpm 11+ ignores build scripts by default for security reasons
      # esbuild and sharp are required devDependencies for Astro builds
      # Must use pnpm approve-builds command (PNPM_ALLOW_BUILDS env var doesn't work in pnpm 11+)
      - name: Approve build scripts for required packages
        run: |
          echo "✅ Approving build scripts for esbuild and sharp (pnpm 11+ security)..."
          pnpm approve-builds esbuild sharp || echo "Build scripts already approved"

      - name: Configure pnpm PATH and verify availability
        run: |
          # Get pnpm's actual global bin directory
          PNPM_GLOBAL_BIN=$(pnpm bin -g)
          echo "PNPM_GLOBAL_BIN=$PNPM_GLOBAL_BIN" >> $GITHUB_ENV
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH
          mkdir -p "$PNPM_GLOBAL_BIN"
          
          # Verify pnpm is available before use
          if ! command -v pnpm &> /dev/null; then
            echo "❌ ERROR: pnpm is not available in PATH"
            echo "Current PATH: $PATH"
            which pnpm || true
            exit 1
          fi
          
          pnpm --version
          echo "✅ pnpm is available: $(pnpm --version)"
          echo "✅ PATH configured with pnpm global bin directory"

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      - name: Build Astro site
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      
      - name: Setup pnpm global bin directory
        run: |
          # Setup pnpm global bin directory properly
          pnpm setup
          
          # Get and configure the global bin directory
          PNPM_GLOBAL_BIN=$(pnpm config get global-bin-dir 2>/dev/null || echo "$HOME/.pnpm-global/bin")
          echo "PNPM_GLOBAL_BIN=$PNPM_GLOBAL_BIN" >> $GITHUB_ENV
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH
          mkdir -p "$PNPM_GLOBAL_BIN"
          
          # Verify pnpm is available
          if ! command -v pnpm &> /dev/null; then
            echo "❌ ERROR: pnpm is not available in PATH"
            echo "Current PATH: $PATH"
            which pnpm || true
            exit 1
          fi
          
          pnpm --version
          echo "✅ pnpm is available: $(pnpm --version)"
          echo "✅ PATH configured with pnpm global bin directory"

      - name: Install Lighthouse CLI globally
        run: |
          # Install global dependencies using pnpm (not npm) for consistency
          echo "📦 Installing global dependencies with pnpm..."
          pnpm add -g lighthouse @lhci/cli
          
          # Verify installations with proper error handling
          if ! command -v lhci &> /dev/null; then
            echo "❌ ERROR: lhci not found after installation"
            echo "PATH is: $PATH"
            which lhci || true
            echo "🔧 Available commands: $(compgen -c | grep -E 'lhci|lighthouse|pnpm' | head -20)"
            exit 1
          fi
          
          if ! command -v lighthouse &> /dev/null; then
            echo "❌ ERROR: lighthouse not found after installation"
            echo "PATH is: $PATH"
            which lighthouse || true
            echo "🔧 Available commands: $(compgen -c | grep -E 'lhci|lighthouse|pnpm' | head -20)"
            exit 1
          fi
          
          echo "✅ Lighthouse CLI installed successfully"
          lhci --version
          lighthouse --version
      
      - name: Run Lighthouse CI with GitHub App Token
        uses: treosh/lighthouse-ci-action@v10
        id: lighthouse
        continue-on-error: true
        with:
          urls: |
            https://hanbini96.github.io/HanBin-Baik-Blog/
            https://hanbini96.github.io/HanBin-Baik-Blog/blog
            https://hanbini96.github.io/HanBin-Baik-Blog/about
          uploadArtifacts: true
          artifactName: "lighthouse-results"
          temporaryPublicStorage: true
          configPath: ./lighthouserc.js

      - name: Upload Lighthouse results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results-${{ github.sha }}
          path: |
            .lighthouseci
            lighthouse-*.html
            lighthouse-*.json
            .lighthouseci/manifest.json
          retention-days: 7

  performance-benchmark:
    name: Collect Performance Metrics
    needs: lighthouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up pnpm with global bin directory
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false
          ignore-off: true
        env:
          PNPM_HOME: /home/runner/.pnpm-global
          PATH: /home/runner/.pnpm-global/bin:/usr/local/bin:/usr/bin:/bin
      
      - name: Configure PATH for global binaries
        run: |
          # Configure PATH consistently with lighthouse job
          PNPM_GLOBAL_BIN=$(pnpm config get global-bin-dir 2>/dev/null || echo "/home/runner/.pnpm-global/bin")
          echo "PNPM_GLOBAL_BIN=$PNPM_GLOBAL_BIN" >> $GITHUB_ENV
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH
          mkdir -p "$PNPM_GLOBAL_BIN"
          
          # Verify pnpm is available
          if ! command -v pnpm &> /dev/null; then
            echo "❌ ERROR: pnpm is not available in PATH"
            echo "Current PATH: $PATH"
            which pnpm || true
            exit 1
          fi
          
          pnpm --version
      
      # CRITICAL FIX for pnpm 11+ security: Approve build scripts
      # pnpm 11+ ignores build scripts by default for security reasons
      # esbuild and sharp are required devDependencies for Astro builds
      # Must use pnpm approve-builds command (PNPM_ALLOW_BUILDS env var doesn't work in pnpm 11+)
      - name: Approve build scripts for required packages
        run: |
          echo "✅ Approving build scripts for esbuild and sharp (pnpm 11+ security)..."
          pnpm approve-builds esbuild sharp || echo "Build scripts already approved"

      - name: Update browser compatibility data
        run: |
          echo "Updating browser compatibility data..."
          npx update-browserslist-db@latest || echo "Warning: browserslist update failed, continuing..."
          pnpm add -D baseline-browser-mapping@latest || echo "Warning: baseline-browser-mapping install failed, continuing..."
          echo "Browser data update completed"
      
      - name: Setup pnpm global bin directory
        run: |
          pnpm setup
          PNPM_GLOBAL_BIN=$(pnpm config get global-bin-dir 2>/dev/null || echo "$HOME/.pnpm-global/bin")
          echo "PNPM_GLOBAL_BIN=$PNPM_GLOBAL_BIN" >> $GITHUB_ENV
          echo "$PNPM_GLOBAL_BIN" >> $GITHUB_PATH
          mkdir -p "$PNPM_GLOBAL_BIN"
      
      - name: Create performance history directory
        run: mkdir -p .performance-history
      
      - name: Install global dependencies
        run: |
          pnpm add -g lighthouse
          lighthouse --version || echo "lighthouse not found"
      
      - name: Parse and store performance metrics
        if: always()
        run: |
          mkdir -p .performance-history
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          DATE=$(date +%Y-%m-%d)
          
          cat > .performance-history/perf-$TIMESTAMP.json << PERFDATA_EOF
          {
            "timestamp": "$TIMESTAMP",
            "date": "$DATE",
            "service": "hanbin-baik-blog",
            "version": "1.0.0",
            "metrics": {}
          }
          PERFDATA_EOF
          
          echo "Extracting performance metrics..."
          
          if [ -d ".lighthouseci" ]; then
            for report in .lighthouseci/manifest.json; do
              if [ -f "$report" ]; then
                echo "Processing $report..."
                
                PERF_SCORE=$(node -e "try { const data = require('./' + process.argv[1]); const results = data.map(r => r.summary?.categories?.performance); const avg = results.reduce((a,b) => a + (b||0), 0) / results.length; console.log(Math.round(avg * 100)); } catch(e) { console.log('0'); } " "$report")
                LCP=$(node -e "try { const data = require('./' + process.argv[1]); const results = data.map(r => r.summary?.audits?.['largest-contentful-paint']?.numericValue || 0); const avg = results.reduce((a,b) => a + b, 0) / results.length; console.log(Math.round(avg)); } catch(e) { console.log('0'); } " "$report")
                FCP=$(node -e "try { const data = require('./' + process.argv[1]); const results = data.map(r => r.summary?.audits?.['first-contentful-paint']?.numericValue || 0); const avg = results.reduce((a,b) => a + b, 0) / results.length; console.log(Math.round(avg)); } catch(e) { console.log('0'); } " "$report")
                CLS=$(node -e "try { const data = require('./' + process.argv[1]); const results = data.map(r => r.summary?.audits?.['cumulative-layout-shift']?.numericValue || 0); const avg = results.reduce((a,b) => a + b, 0) / results.length; console.log(avg.toFixed(3)); } catch(e) { console.log('0.000'); } " "$report")
                FID=$(node -e "try { const data = require('./' + process.argv[1]); const results = data.map(r => r.summary?.audits?.['first-input-delay']?.numericValue || 0); const avg = results.reduce((a,b) => a + b, 0) / results.length; console.log(Math.round(avg)); } catch(e) { console.log('0'); } " "$report")
                TBT=$(node -e "try { const data = require('./' + process.argv[1]); const results = data.map(r => r.summary?.audits?.['total-blocking-time']?.numericValue || 0); const avg = results.reduce((a,b) => a + b, 0) / results.length; console.log(Math.round(avg)); } catch(e) { console.log('0'); } " "$report")
                
                cat >> .performance-history/perf-$TIMESTAMP.json << METRICS_EOF
              "metrics": {
                "performanceScore": $PERF_SCORE,
                "firstContentfulPaint": $FCP,
                "largestContentfulPaint": $LCP,
                "cumulativeLayoutShift": $CLS,
                "firstInputDelay": $FID,
                "totalBlockingTime": $TBT
              }
              METRICS_EOF
              fi
            done
          fi
          
          echo "}" >> .performance-history/perf-$TIMESTAMP.json
          echo "Performance metrics collected"
          cat .performance-history/perf-$TIMESTAMP.json | head -20
      
      - name: Commit performance metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .performance-history/
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: Update performance metrics [skip ci]"
            git push
            echo "✅ Performance metrics committed and pushed"
          else
            echo "ℹ️ No changes in performance metrics"
          fi

  performance-summary:
    name: Generate Performance Summary
    needs: performance-benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate performance summary
        run: |
          echo "📊 Performance Monitoring Summary"
          echo "==============================="
          echo ""
          echo "📈 Recent Performance Metrics:"
          ls -lt .performance-history/ | head -6 | awk '{print "  - " $9}'
          echo ""
          echo "✅ Performance monitoring completed successfully"

  performance-alerts:
    name: Performance Alerts
    needs: performance-benchmark
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create performance history directory if missing
        run: mkdir -p .performance-history
      
      - name: Performance monitoring status check
        run: |
          echo "📊 Performance Monitoring Status Check"
          echo "======================================"
          echo ""
          echo "✅ Workflow completed successfully"
