name: Lint Workflow Files

on:
  pull_request:
    branches: [ main, dev-update ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [ main, dev-update ]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error
