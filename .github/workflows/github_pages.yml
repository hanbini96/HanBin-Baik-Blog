name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev-update ]
  workflow_dispatch: {}
  schedule:
    - cron: '*/30 * * * *'  # Run every 30 minutes for health checks

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PORT: 4321
      LAST_BUILD: ${{ github.sha }}
      LAST_COMMIT: ${{ github.event.head_commit.message }}
      BUILD_TIMESTAMP: ${{ github.event.repository.updated_at }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        id: pnpm-setup
        with:
          version: 11.21.0
          run_install: false
        env:
          PNPM_HOME: /home/runner/.pnpm-global
      
      - name: Set up Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      # CRITICAL FIX for pnpm 11+ security: Approve build scripts before install
      - name: Approve build scripts for required packages
        run: |
          echo "✅ Approving build scripts for esbuild and sharp (pnpm 11+ security)..."
          pnpm approve-builds esbuild@0.25.12 esbuild@0.27.3 sharp@0.34.5 || echo "Build scripts already approved"

      - name: Configure pnpm PATH and verify
        run: |
          # Add pnpm to PATH for all subsequent steps
          echo "$(pnpm bin)" >> $GITHUB_PATH
          echo "$(npm bin -g)" >> $GITHUB_PATH
          # Create global bin directory if it doesn't exist
          mkdir -p "$HOME/.pnpm-global/bin"
          echo "$HOME/.pnpm-global/bin" >> $GITHUB_PATH
          
          # Verify pnpm is available BEFORE proceeding
          if ! command -v pnpm &> /dev/null; then
            echo "❌ ERROR: pnpm is not available in PATH"
            echo "Current PATH: $PATH"
            pnpm config get global-bin-dir || true
            which pnpm || true
            exit 1
          fi
          
          pnpm --version
          echo "✅ pnpm is available: $(pnpm --version)"

      - name: Update browser compatibility data
        run: |
          echo "Updating browser compatibility data..."
          npx update-browserslist-db@latest || echo "Warning: browserslist update failed, continuing..."
          pnpm add -D baseline-browser-mapping@latest || echo "Warning: baseline-browser-mapping install failed, continuing..."
          echo "✅ Browser data update completed"

      - name: Build Astro site
        run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Verify build output
        run: |
          echo "📊 Build Output Verification"
          echo "Size: $(du -sh dist/)"
          echo "File count: $(find dist/ -type f | wc -l)"
          
          # Remove symlinks if any (GitHub Pages doesn't allow them)
          SYMLINKS=$(find dist/ -type l | wc -l)
          if [ $SYMLINKS -gt 0 ]; then
            echo "⚠️ Found $SYMLINKS symlinks - removing them"
            find dist/ -type l -delete
          fi
          
          # Remove hard links if any (GitHub Pages doesn't allow them)
          HARDLINKS=$(find dist/ -type f -links +1 | wc -l)
          if [ $HARDLINKS -gt 0 ]; then
            echo "⚠️ Found $HARDLINKS files with hard links - removing duplicates"
            # Remove files that have multiple hard links
            find dist/ -type f -links +1 -delete
          fi
          
          # Check for large files (>10MB)
          LARGE_FILES=$(find dist/ -size +10M | wc -l)
          if [ $LARGE_FILES -gt 0 ]; then
            echo "⚠️ Found $LARGE_FILES files >10MB"
            find dist/ -size +10M -ls
          fi
          
          # Verify no symlinks or hard links remain
          FINAL_SYMLINKS=$(find dist/ -type l | wc -l)
          FINAL_HARDLINKS=$(find dist/ -type f -links +1 | wc -l)
          
          if [ $FINAL_SYMLINKS -gt 0 ] || [ $FINAL_HARDLINKS -gt 0 ]; then
            echo "❌ ERROR: Found remaining symlinks ($FINAL_SYMLINKS) or hard links ($FINAL_HARDLINKS)"
            echo "This will cause GitHub Pages deployment to fail"
            exit 1
          fi
          
          echo "✅ Build artifact verified and ready for deployment"
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-${{ github.sha }}-${{ github.run_number }}
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-${{ github.sha }}-${{ github.run_number }}
          path: dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  health-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check Status Endpoint
        run: |
          # Wait for deployment to complete
          sleep 60
          
          # Test static status endpoint (works with GitHub Pages)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hanbini96.github.io/HanBin-Baik-Blog/status.json)
          
          if [ "$STATUS" != "200" ]; then
            echo "❌ Status check failed with status code: $STATUS"
            echo "This could indicate a deployment issue"
            exit 1
          fi
          
          echo "✅ Status check passed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  uptime-monitoring:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Monitor Uptime
        run: |
          # Simple uptime monitoring
          START_TIME=$(date +%s)
          
          # Make multiple requests to test reliability
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hanbini96.github.io/HanBin-Baik-Blog/)
            if [ "$STATUS" != "200" ]; then
              echo "Uptime check $i failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          
          END_TIME=$(date +%s)
          UPTIME=$((END_TIME - START_TIME))
          
          echo "Uptime monitoring completed successfully in ${UPTIME}s"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
