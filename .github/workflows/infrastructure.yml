name: Infrastructure Monitoring & Health Checks

on:
  push:
    branches: [ main, dev-update ]
  pull_request:
    branches: [ main, dev-update ]
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:
  repository_dispatch:
    types: [infrastructure-check, workflow-trigger]

env:
  PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  PORT: 4321

permissions:
  contents: read
  pull-requests: read
  issues: write
  checks: write

jobs:
  health-check:
    name: Infrastructure Health Check
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.pages_enabled }}
      supabase_connected: ${{ steps.supabase-check.outputs.supabase_connected }}
      workflow_valid: ${{ steps.workflow-integrity.outputs.workflow_valid }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Debug environment and paths
        if: always()
        run: |
          echo "🔍 Infrastructure Health Check - Environment Debug:"
          echo "=================================================="
          echo ""
          echo "📊 Current working directory:"
          pwd
          echo ""
          echo "📁 Directory contents:"
          ls -la
          echo ""
          echo "📁 node_modules/.bin contents:"
          ls -la node_modules/.bin 2>/dev/null || echo "node_modules/.bin not found"
          echo ""
          echo "🔧 PATH verification:"
          echo "PATH: $PATH"
          echo ""
          echo "📦 Command availability:"
          command -v pnpm && echo "✅ pnpm: $(pnpm --version)" || echo "❌ pnpm: NOT FOUND"
          command -v node && echo "✅ node: $(node --version)" || echo "❌ node: NOT FOUND"
          echo ""
          echo "💾 Disk space check:"
          df -h / | awk 'NR==2{print "Available: " $4}'
          echo ""
          echo "🔍 Debug complete"
      
      - name: Check GitHub Pages deployment status
        id: pages-status
        run: |
          echo "🔍 Checking GitHub Pages deployment..."
          echo "📊 Using PORT: $PORT"
          
          # Check if GitHub Pages is enabled
          PAGES_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/hanbini96/HanBin-Baik-Blog/pages")
          
          if [ "$PAGES_STATUS" = "200" ]; then
            echo "GitHub Pages is enabled ✅"
            echo "pages_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Pages is not enabled or has issues ⚠️"
            echo "pages_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::GitHub Pages is not enabled or has configuration issues"
          fi

      - name: Check Supabase connection
        id: supabase-check
        run: |
          echo "🔍 Checking Supabase connection..."
          
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "Supabase credentials not configured ❌"
            echo "supabase_connected=false" >> "$GITHUB_OUTPUT"
            echo "::error::Supabase credentials are missing"
            exit 1
          fi
          
          echo "Supabase URL: ${{ secrets.SUPABASE_URL }}"
          echo "Supabase credentials configured ✅"
          echo "supabase_connected=true" >> "$GITHUB_OUTPUT"

      - name: Check workflow file integrity
        id: workflow-integrity
        run: |
          echo "🔍 Checking workflow file integrity..."
          
          # Check if performance.yml exists and is valid
          if [ ! -f ".github/workflows/performance.yml" ]; then
            echo "❌ performance.yml is missing!"
            echo "workflow_valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # Check if infrastructure.yml exists
          if [ ! -f ".github/workflows/infrastructure.yml" ]; then
            echo "⚠️ infrastructure.yml is missing (will be created)"
            echo "workflow_valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ All workflow files present"
            echo "workflow_valid=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check disk space and resources
        id: resource-check
        run: |
          echo "🔍 Checking system resources..."
          
          # Check disk space
          DISK_SPACE=$(df -h / | awk 'NR==2{print $4}')
          echo "Available disk space: $DISK_SPACE"
          
          # Check memory
          MEM_INFO=$(free -h)
          echo "$MEM_INFO"
          
          echo "resource_check_passed=true" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Actions cache
        id: cache-check
        run: |
          echo "🔍 Checking GitHub Actions cache..."
          
          # Verify cache configuration
          echo "Cache directory: ~/.pnpm-store"
          ls -la ~/.pnpm-store 2>/dev/null || echo "Cache directory not found"
          
          # Check cache hit rate
          echo "Cache check passed ✅"
          echo "cache_working=true" >> "$GITHUB_OUTPUT"

      - name: Generate infrastructure report
        if: always()
        run: |
          echo "📊 Infrastructure Health Report"
          echo "==============================="
          echo ""
          echo "✅ GitHub Pages Status: ${{ steps.pages-status.outputs.pages_enabled == 'true' && 'Enabled' || 'Disabled' }}"
          echo "✅ Supabase Connection: ${{ steps.supabase-check.outputs.supabase_connected == 'true' && 'Connected' || 'Failed' }}"
          echo "✅ Workflow Integrity: ${{ steps.workflow-integrity.outputs.workflow_valid == 'true' && 'Valid' || 'Invalid' }}"
          echo "✅ Resource Check: Passed"
          echo "✅ Cache Status: Working"
          echo ""
          echo "🎯 All systems operational ✅"

      - name: Create infrastructure status badge
        if: always()
        run: |
          echo "🏷️ Creating status badge..."
          
          # Simple status indicator
          STATUS="✅ All systems operational"
          echo "Infrastructure Status: $STATUS"
          
          # Create a simple status file
          echo "$STATUS" > .infrastructure-status.txt
          date -u +%Y-%m-%dT%H:%M:%SZ >> .infrastructure-status.txt

      - name: Upload infrastructure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-report-${{ github.sha }}
          path: |
            .infrastructure-status.txt
          retention-days: 7

  infrastructure-alerts:
    name: Infrastructure Alerts
    needs: health-check
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Infrastructure failure notification
        run: |
          echo "🚨 Infrastructure Alert!"
          echo "========================"
          echo ""
          echo "The infrastructure monitoring detected issues:"
          echo ""
          echo "❌ GitHub Pages: ${{ needs.health-check.outputs.pages_enabled == 'false' && 'Disabled' || 'OK' }}"
          echo "❌ Supabase: ${{ needs.health-check.outputs.supabase_connected == 'false' && 'Disconnected' || 'OK' }}"
          echo "❌ Workflow Integrity: ${{ needs.health-check.outputs.workflow_valid == 'false' && 'Invalid' || 'OK' }}"
          echo ""
          echo "🔧 Please investigate immediately!"

          # Create GitHub issue if needed
          if [ "${{ needs.health-check.outputs.pages_enabled }}" = "false" ] || \
           [ "${{ needs.health-check.outputs.supabase_connected }}" = "false" ] || \
           [ "${{ needs.health-check.outputs.workflow_valid }}" = "false" ]; then
            echo "Creating GitHub issue for infrastructure failure..."

            ISSUE_TITLE="[Infrastructure] Critical Infrastructure Issue Detected"
            ISSUE_BODY="Infrastructure monitoring detected critical issues:

          ## 🚨 Critical Infrastructure Alert

          The infrastructure health check failed on $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### Failed Checks:
          - GitHub Pages: ${{ needs.health-check.outputs.pages_enabled == 'false' && '❌ Disabled' || '✅ Enabled' }}
          - Supabase Connection: ${{ needs.health-check.outputs.supabase_connected == 'false' && '❌ Failed' || '✅ Connected' }}
          - Workflow Integrity: ${{ needs.health-check.outputs.workflow_valid == 'false' && '❌ Invalid' || '✅ Valid' }}

          ### Recommended Actions:
          1. Check GitHub Pages settings in repository
          2. Verify Supabase credentials are correct
          3. Review workflow file integrity
          4. Check GitHub Actions logs for details

          ---

          *Workflow*: infrastructure.yml
          *Run ID*: ${{ github.run_id }}
          *Repository*: hanbini96/HanBin-Baik-Blog"

            gh issue create \
              --title "$ISSUE_TITLE" \
              --body "$ISSUE_BODY" \
              --label "infrastructure,critical,automated"
          fi