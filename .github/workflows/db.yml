name: Supabase DB

# Single Supabase project (free tier, public repo):
#   - Pull requests: apply every migration to a throwaway local Postgres on the
#     runner. No secrets, no network access to the real database, safe for forks.
#   - Push to main (or manual run): push migrations + deploy Edge Functions to the
#     one production project, behind the `production` environment.
# Connection: PROD_DB_URL must be the Session pooler string (IPv4, port 5432),
# because GitHub-hosted runners have no IPv6 route to db.<ref>.supabase.co.
# See docs/development/SUPABASE_CI.md.

on:
  pull_request:
    branches: [main, dev-update]
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-db-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  validate:
    name: Validate migrations (local Postgres)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Start local Postgres and apply all migrations
        run: |
          supabase db start
          supabase migration up --local

      - name: Verify core schema exists
        env:
          LOCAL_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          psql "$LOCAL_DB" -v ON_ERROR_STOP=1 -c "
            do \$\$
            begin
              if to_regclass('public.posts') is null then
                raise exception 'public.posts missing after migrations';
              end if;
            end \$\$;"
          psql "$LOCAL_DB" -c "select version, name from supabase_migrations.schema_migrations order by version;"

      - name: Lint database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Stop local Postgres
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Deploy to Supabase (production)
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_URL: ${{ secrets.PROD_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Check required secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret for $name is not set"
              missing=1
            fi
          done
          if [[ -n "$SUPABASE_DB_URL" && "$SUPABASE_DB_URL" != *pooler.supabase.com* ]]; then
            echo "::warning::PROD_DB_URL is not a pooler URL; db.<ref>.supabase.co is IPv6-only and unreachable from GitHub runners"
          fi
          exit "$missing"

      # The baseline schema (20250101000000..02) was created before migrations were
      # tracked. If production already has it but no history row, record it as
      # applied instead of re-running it. No-op once recorded.
      - name: Record baseline migrations if schema predates history
        run: |
          has_schema=$(psql "$SUPABASE_DB_URL" -tAc "select to_regclass('public.posts') is not null")
          has_history=$(psql "$SUPABASE_DB_URL" -tAc "select to_regclass('supabase_migrations.schema_migrations') is not null and exists (select 1 from supabase_migrations.schema_migrations where version = '20250101000000')" 2>/dev/null || echo f)
          echo "baseline schema present: $has_schema, recorded: $has_history"
          if [ "$has_schema" = "t" ] && [ "$has_history" != "t" ]; then
            supabase migration repair --db-url "$SUPABASE_DB_URL" --status applied \
              20250101000000 20250101000001 20250101000002
          fi

      # Earlier runs may have recorded versions from the old 00_*.sql names.
      # Drop history rows that have no matching local file (history only, no schema change).
      - name: Remove stale migration history rows
        run: |
          remote=$(psql "$SUPABASE_DB_URL" -tAc "select version from supabase_migrations.schema_migrations" 2>/dev/null || true)
          for v in $remote; do
            if ! compgen -G "supabase/migrations/${v}_*.sql" > /dev/null; then
              echo "Stale history version $v (no local file); marking reverted"
              supabase migration repair --db-url "$SUPABASE_DB_URL" --status reverted "$v"
            fi
          done

      - name: Migration status (before)
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Sync Edge Function secrets
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -z "$TURNSTILE_SECRET" ]; then
            echo "TURNSTILE_SECRET not set; skipping"
            exit 0
          fi
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "TURNSTILE_SECRET=$TURNSTILE_SECRET" \
            "ALLOWED_ORIGINS=https://hanbini96.github.io"

      - name: Deploy Edge Functions
        run: |
          shopt -s nullglob
          fns=(supabase/functions/*/index.ts)
          if [ ${#fns[@]} -eq 0 ]; then
            echo "No Edge Functions to deploy"
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
