name: Supabase DB Migrations

on:
  push:
    branches: [ main ]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db.yml"
  pull_request:
    branches: [ main, dev-update ]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db.yml"
  workflow_dispatch: {}

jobs:
  deploy-staging:
    name: Apply migrations to STAGING
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Network Diagnostics
        run: |
          echo "📊 Network Connectivity Report:"
          echo "   curl: $(which curl && curl --version | head -1 || echo 'NOT AVAILABLE')"
          echo "   DNS resolution: $(timeout 5 nslookup cli.supabase.com 2>&1 | grep -E 'Address|Name:' || echo 'FAILED')"
          echo "   HTTP connectivity: $(curl -I -fsSL https://cli.supabase.com --max-time 10 2>&1 | head -3 || echo 'FAILED')"
          echo "   GitHub connectivity: $(curl -I -fsSL https://github.com --max-time 10 2>&1 | head -3 || echo 'FAILED')"

      - name: Install Supabase CLI
        run: |
          echo "🔧 Installing Supabase CLI with comprehensive error handling..."
          
          # Create installation directory first
          mkdir -p "$HOME/.supabase/bin"
          
          # Method 1: Official installation script with proper error handling
          echo "🚀 Method 1: Official installation script"
          if curl -fsSL https://cli.supabase.com/install/linux > /tmp/supabase_install.sh 2>&1 && bash /tmp/supabase_install.sh; then
            echo "✅ Official installation succeeded"
            rm -f /tmp/supabase_install.sh
          else
            echo "❌ Official installation failed, trying direct download..."
            rm -f /tmp/supabase_install.sh
            
            # Method 2: Direct binary download with fallback
            echo "🔄 Method 2: Direct binary download"
            local_arch="$(uname -s)_$(uname -m)"
            binary_url="https://github.com/supabase/cli/releases/latest/download/supabase_${local_arch}"
            
            if curl -fsSL -o "$HOME/.supabase/bin/supabase" "$binary_url"; then
              chmod +x "$HOME/.supabase/bin/supabase"
              echo "✅ Direct binary download succeeded"
            else
              echo "❌ ERROR: All installation methods failed"
              echo "📊 Diagnostic information:"
              echo "   curl availability: $(which curl || echo 'NOT FOUND')"
              echo "   curl version: $(curl --version 2>&1 | head -1 || echo 'FAILED')"
              echo "   Network test: $(curl -I -fsSL https://cli.supabase.com 2>&1 | head -3 || echo 'FAILED')"
              echo "   Installation directory: $(ls -la "$HOME/.supabase/bin" 2>&1 || echo 'NOT CREATED')"
              echo "   Available binaries: https://github.com/supabase/cli/releases"
              exit 1
            fi
          fi
          
          # Verify installation
          echo "🔍 Verifying Supabase CLI installation..."
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH
          export PATH="$HOME/.supabase/bin:$PATH"
          
          if command -v supabase >/dev/null 2>&1; then
            echo "✅ Supabase CLI installed: $(supabase --version 2>&1)"
          else
            echo "❌ ERROR: Installation verification failed"
            echo "Available binaries:"
            find "$HOME/.supabase" -type f 2>/dev/null || echo "No files found"
            exit 1
          fi

      - name: Push migrations to STAGING
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "❌ ERROR: STAGING_DB_URL secret is missing"
            echo "Please add the secret to GitHub: https://github.com/hanbini96/HanBin-Baik-Blog/settings/secrets/actions"
            echo "Connection string format: postgresql://postgres:[password]@db.supabase.co:5432/postgres?search_path=public&sslmode=require"
            exit 1
          fi
          echo "✅ STAGING_DB_URL secret found, applying migrations..."
          echo "📋 Migration files to be applied:"
          ls -la supabase/migrations/ || true
          echo "🚀 Applying migrations to STAGING database..."
          supabase db push --db-url "$STAGING_DB_URL" --debug || {
            echo "❌ ERROR: Failed to apply migrations to STAGING"
            echo "Check Supabase CLI version and database connection"
            echo "Debug info:"
            supabase status || true
            exit 1
          }
          echo "✅ Migrations applied successfully to STAGING"

  deploy-prod:
    name: Apply migrations to PROD (manual)
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub Environments
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm and Node.js
        uses: ./.github/actions/setup-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Network Diagnostics
        run: |
          echo "📊 Network Connectivity Report:"
          echo "   curl: $(which curl && curl --version | head -1 || echo 'NOT AVAILABLE')"
          echo "   DNS resolution: $(timeout 5 nslookup cli.supabase.com 2>&1 | grep -E 'Address|Name:' || echo 'FAILED')"
          echo "   HTTP connectivity: $(curl -I -fsSL https://cli.supabase.com --max-time 10 2>&1 | head -3 || echo 'FAILED')"
          echo "   GitHub connectivity: $(curl -I -fsSL https://github.com --max-time 10 2>&1 | head -3 || echo 'FAILED')"

      - name: Install Supabase CLI
        run: |
          echo "🔧 Installing Supabase CLI with comprehensive error handling..."
          
          # Create installation directory first
          mkdir -p "$HOME/.supabase/bin"
          
          # Method 1: Official installation script with proper error handling
          echo "🚀 Method 1: Official installation script"
          if curl -fsSL https://cli.supabase.com/install/linux > /tmp/supabase_install.sh 2>&1 && bash /tmp/supabase_install.sh; then
            echo "✅ Official installation succeeded"
            rm -f /tmp/supabase_install.sh
          else
            echo "❌ Official installation failed, trying direct download..."
            rm -f /tmp/supabase_install.sh
            
            # Method 2: Direct binary download with fallback
            echo "🔄 Method 2: Direct binary download"
            local_arch="$(uname -s)_$(uname -m)"
            binary_url="https://github.com/supabase/cli/releases/latest/download/supabase_${local_arch}"
            
            if curl -fsSL -o "$HOME/.supabase/bin/supabase" "$binary_url"; then
              chmod +x "$HOME/.supabase/bin/supabase"
              echo "✅ Direct binary download succeeded"
            else
              echo "❌ ERROR: All installation methods failed"
              echo "📊 Diagnostic information:"
              echo "   curl availability: $(which curl || echo 'NOT FOUND')"
              echo "   curl version: $(curl --version 2>&1 | head -1 || echo 'FAILED')"
              echo "   Network test: $(curl -I -fsSL https://cli.supabase.com 2>&1 | head -3 || echo 'FAILED')"
              echo "   Installation directory: $(ls -la "$HOME/.supabase/bin" 2>&1 || echo 'NOT CREATED')"
              echo "   Available binaries: https://github.com/supabase/cli/releases"
              exit 1
            fi
          fi
          
          # Verify installation
          echo "🔍 Verifying Supabase CLI installation..."
          echo "$HOME/.supabase/bin" >> $GITHUB_PATH
          export PATH="$HOME/.supabase/bin:$PATH"
          
          if command -v supabase >/dev/null 2>&1; then
            echo "✅ Supabase CLI installed: $(supabase --version 2>&1)"
          else
            echo "❌ ERROR: Installation verification failed"
            echo "Available binaries:"
            find "$HOME/.supabase" -type f 2>/dev/null || echo "No files found"
            exit 1
          fi

      - name: Push migrations to PROD
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: |
          if [ -z "$PROD_DB_URL" ]; then
            echo "❌ ERROR: PROD_DB_URL secret is missing"
            echo "Please add the secret to GitHub"
            exit 1
          fi
          echo "✅ PROD_DB_URL secret found, applying migrations..."
          echo "🚀 Applying migrations to PRODUCTION database..."
          supabase db push --db-url "$PROD_DB_URL" --debug || {
            echo "❌ ERROR: Failed to apply migrations to PRODUCTION"
            echo "Manual review required before proceeding"
            exit 1
          }
          echo "✅ Migrations applied successfully to PRODUCTION"
